<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clearance Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181B;
    --panel: #1F2124;
    --hairline: #33302A;
    --brass: #AD8A55;
    --brass-dim: #7C6640;
    --ivory: #EDE7DC;
    --muted: #8C8478;
    --sage: #7C9473;
    --rust: #9B5A46;
    --amber: #C9A227;
  }

  * { box-sizing: border-box; }
  ::selection { background: var(--brass-dim); color: var(--ivory); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ivory);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  a { color: var(--brass); }

  .page {
    display: flex;
    min-height: 100vh;
  }

  .main {
    flex: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px;
    width: 100%;
  }

  /* --- Header --- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    margin-bottom: 36px;
  }

  .wordmark { display: flex; align-items: baseline; gap: 14px; }
  .mark { width: 30px; height: 30px; flex-shrink: 0; color: var(--brass); }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.2px;
    margin: 0;
    color: var(--ivory);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }

  .controls { display: flex; align-items: center; gap: 12px; }

  .controls input[type=text] {
    background: var(--panel);
    border: 1px solid var(--hairline);
    color: var(--ivory);
    padding: 10px 14px;
    width: 180px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
  }
  .controls input[type=text]:focus { border-color: var(--brass); }
  .controls input[type=text]::placeholder { color: var(--muted); }

  button {
    background: transparent;
    color: var(--brass);
    border: 1px solid var(--brass-dim);
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  button:hover { background: var(--brass); color: #17181B; border-color: var(--brass); }
  button:disabled { opacity: 0.5; cursor: default; }

  /* --- Status pills --- */
  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid currentColor;
    letter-spacing: 0.3px;
  }
  .status-open { color: var(--amber); }
  .status-pending { color: var(--muted); }
  .status-follow_up { color: var(--brass); }
  .status-won { color: var(--sage); }
  .status-lost { color: var(--rust); }

  /* --- Calls grid by status --- */
  .calls-by-status {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
    margin-bottom: 48px;
  }

  .status-column {
    display: flex;
    flex-direction: column;
  }

  .status-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--hairline);
  }

  .status-header h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 17px;
    margin: 0;
    color: var(--ivory);
  }

  .status-count {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--brass);
    margin-left: auto;
  }

  /* --- Call cards --- */
  .call-card {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .call-card:hover {
    background: rgba(173,138,85,0.08);
    border-color: var(--brass-dim);
  }

  .call-card-top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
  .call-card-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--ivory);
  }
  .call-card-phone { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .call-card-meta { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .call-card-score {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    color: var(--brass);
  }
  .call-card-score.high { color: var(--sage); }
  .call-card-score.low { color: var(--rust); }

  .call-card-buttons {
    display: flex;
    gap: 4px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .call-card-buttons button {
    flex: 1;
    min-width: 70px;
    padding: 6px 8px;
    font-size: 11px;
  }

  /* --- Call bank sidebar --- */
  .call-bank-sidebar {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: min(420px, 100vw);
    background: var(--panel);
    border-left: 1px solid var(--hairline);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 50;
    overflow-y: auto;
    padding: 32px;
  }
  .call-bank-sidebar.open {
    transform: translateX(0);
  }

  .call-bank-close { position: absolute; top: 16px; right: 16px; padding: 6px 10px; font-size: 16px; }

  .call-bank-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    margin: 0 0 24px;
  }

  .bank-form-group {
    margin-bottom: 18px;
  }
  .bank-form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .bank-form-group input,
  .bank-form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--hairline);
    color: var(--ivory);
    padding: 10px;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  .bank-form-group textarea { min-height: 80px; resize: vertical; }

  .bank-form-group button { width: 100%; }

  .bank-list {
    margin-top: 32px;
    border-top: 1px solid var(--hairline);
    padding-top: 20px;
  }
  .bank-list h3 {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    color: var(--brass);
    margin: 0 0 12px;
  }
  .banked-call {
    background: rgba(173,138,85,0.08);
    border: 1px solid var(--brass-dim);
    border-radius: 3px;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .banked-call-name {
    color: var(--ivory);
    font-weight: 500;
  }
  .banked-call-reason { color: var(--muted); font-style: italic; margin-top: 2px; }

  /* --- Panel detail view --- */
  .scrim { position: fixed; inset: 0; background: rgba(10,10,10,0.55); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 40; }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .detail-panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(520px, 100vw);
    background: var(--panel); border-right: 1px solid var(--hairline);
    transform: translateX(-100%); transition: transform 0.25s ease;
    z-index: 41; overflow-y: auto; padding: 32px;
  }
  .detail-panel.open { transform: translateX(0); }

  .detail-close { position: absolute; top: 16px; right: 16px; padding: 6px 10px; font-size: 16px; }

  .detail-name {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .detail-meta { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

  .score-hero { display: flex; align-items: baseline; gap: 10px; margin-bottom: 24px; }
  .score-hero .num { font-family: 'Fraunces', serif; font-weight: 500; font-size: 50px; line-height: 1; }
  .score-hero .of100 { color: var(--muted); font-size: 15px; }

  .detail-section { margin-bottom: 24px; }
  .detail-section h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--brass);
    margin: 0 0 10px;
  }
  .detail-section ul { margin: 0; padding-left: 18px; }
  .detail-section li { font-size: 13px; margin-bottom: 6px; color: var(--ivory); }

  .empty-note { color: var(--muted); font-style: italic; font-size: 13px; }

  @media (max-width: 900px) {
    .calls-by-status { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    .main { padding: 16px; }
    header { flex-direction: column; align-items: flex-start; }
    .controls { width: 100%; flex-wrap: wrap; }
    .controls input { width: 100%; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="main">
    <header>
      <div class="wordmark">
        <svg class="mark" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 26V10L15 3L26 10V26" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M11 26V16H19V26" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <div>
          <h1>Clearance Outreach</h1>
          <div class="subtitle">call coaching + follow-up</div>
        </div>
      </div>
      <div class="controls">
        <input type="text" id="apiKey" placeholder="Admin key" />
        <button onclick="loadAll()">Load</button>
        <button onclick="syncCalls()" id="syncBtn">Sync calls</button>
        <button onclick="openBank()">📋 Call Bank</button>
      </div>
    </header>

    <div class="calls-by-status" id="callsGrid">
      <p class="empty-note">Enter admin key and click Load.</p>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel" role="dialog" aria-modal="true">
  <button class="detail-close" onclick="closeDetail()" aria-label="Close">&times;</button>
  <div id="detailBody"><p class="empty-note">Loading…</p></div>
</div>

<div class="call-bank-sidebar" id="bankSidebar">
  <button class="call-bank-close" onclick="closeBank()">&times;</button>
  <h2 class="call-bank-title">Call Bank</h2>
  <div id="bankForm">
    <div class="bank-form-group">
      <label>Call to bank:</label>
      <select id="bankCallSelect" style="width:100%; padding:10px; background:var(--bg); border:1px solid var(--hairline); color:var(--ivory); border-radius:3px;">
        <option value="">-- Select a call --</option>
      </select>
    </div>
    <div class="bank-form-group">
      <label>Why bank this call?</label>
      <textarea id="bankReason" placeholder="e.g., 'Excellent objection handling', 'Perfect discovery questions'"></textarea>
    </div>
    <div class="bank-form-group">
      <label>Text option 1</label>
      <textarea id="bankText1" placeholder="First follow-up text template for this situation"></textarea>
    </div>
    <div class="bank-form-group">
      <label>Text option 2</label>
      <textarea id="bankText2" placeholder="Second follow-up text template"></textarea>
    </div>
    <div class="bank-form-group">
      <label>Text option 3</label>
      <textarea id="bankText3" placeholder="Third follow-up text template"></textarea>
    </div>
    <button onclick="saveToBank()">Add to Call Bank</button>
  </div>

  <div class="bank-list" id="bankedCalls" style="display:none;">
    <h3>Banked Calls</h3>
    <div id="bankList"></div>
  </div>
</div>

<script>
let currentData = { calls: [], bankedCalls: [] };
let selectedCallForBank = null;

function openBank() {
  document.getElementById('bankSidebar').classList.add('open');
  refreshBankList();
  populateBankCallSelect();
}
function closeBank() {
  document.getElementById('bankSidebar').classList.remove('open');
}

function openDetail(callId) {
  document.getElementById('scrim').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  loadCallDetail(callId);
}
function closeDetail() {
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
}

async function api(path, opts) {
  const key = document.getElementById('apiKey').value;
  const res = await fetch(path, { ...opts, headers: { ...(opts && opts.headers), 'x-api-key': key } });
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

function money(n) {
  return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function fmtDate(d) {
  return d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
}

async function loadAll() {
  try {
    const calls = await api('/api/calls');
    currentData.calls = calls;
    renderCalls(calls);
  } catch (err) {
    document.getElementById('callsGrid').innerHTML = '<p class="empty-note">Could not load calls: ' + err.message + '</p>';
  }
}

const STATUS_LABELS = {
  open: '🟡 Open',
  pending: '⬜ Pending',
  follow_up: '🔵 Follow-up',
  won: '✅ Won',
  lost: '❌ Lost',
  no_response: '⏸ No Response',
};

function renderCalls(calls) {
  const byStatus = {
    open: [], pending: [], follow_up: [], won: [], lost: [], no_response: []
  };

  for (const c of calls) {
    const status = c.call_status || 'open';
    if (byStatus[status]) byStatus[status].push(c);
  }

  let html = '';
  for (const [status, statusCalls] of Object.entries(byStatus)) {
    if (!statusCalls.length) continue;
    html += `<div class="status-column">
      <div class="status-header">
        <h2>${STATUS_LABELS[status] || status}</h2>
        <div class="status-count">${statusCalls.length}</div>
      </div>`;
    for (const c of statusCalls) {
      const scoreClass = c.overall_score >= 80 ? 'high' : c.overall_score >= 60 ? '' : 'low';
      const scoreHtml = c.overall_score ? `<div class="call-card-score ${scoreClass}">${c.overall_score}</div>` : '<div class="call-card-score">—</div>';
      html += `<div class="call-card" onclick="openDetail(${c.id})">
        <div class="call-card-top">
          <div style="flex:1">
            <div class="call-card-name">${c.contact_name || c.phone_number || 'Unknown'}</div>
            <div class="call-card-phone">${c.contact_phone || c.phone_number || '—'}</div>
            <div class="call-card-meta">${fmtDate(c.start_time)}${c.call_category ? ' · ' + c.call_category : ''}</div>
          </div>
          ${scoreHtml}
        </div>
        <div class="call-card-buttons">
          <button onclick="setStatus(event, ${c.id}, 'follow_up')">Follow-up</button>
          <button onclick="setStatus(event, ${c.id}, 'won')">Won</button>
          <button onclick="addToBank(event, ${c.id})">💾 Bank</button>
        </div>
      </div>`;
    }
    html += '</div>';
  }

  document.getElementById('callsGrid').innerHTML = html;
}

async function setStatus(e, callId, newStatus) {
  e.stopPropagation();
  try {
    await api('/api/calls/' + callId, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ call_status: newStatus }) });
    loadAll();
  } catch (err) {
    alert('Could not update status: ' + err.message);
  }
}

function addToBank(e, callId) {
  e.stopPropagation();
  selectedCallForBank = callId;
  openBank();
}

async function loadCallDetail(id) {
  const body = document.getElementById('detailBody');
  body.innerHTML = '<p class="empty-note">Loading…</p>';
  try {
    const call = await api('/api/calls/' + id);
    let html = `<div class="detail-name">${call.contact_name || call.phone_number || 'Unknown'}</div>
      <div class="detail-meta">${call.direction || ''} · ${fmtDate(call.start_time)}${call.duration_seconds ? ' · ' + Math.round(call.duration_seconds / 60) + ' min' : ''}</div>`;

    if (call.score) {
      html += `<div class="score-hero"><span class="num">${call.score.overall_score}</span><span class="of100">/ 100</span></div>`;
      if (call.score.strengths && call.score.strengths.length) {
        html += `<div class="detail-section"><h3>Strengths</h3><ul>${call.score.strengths.map(s => '<li>' + s + '</li>').join('')}</ul></div>`;
      }
      if (call.score.weaknesses && call.score.weaknesses.length) {
        html += `<div class="detail-section"><h3>To improve</h3><ul>${call.score.weaknesses.map(w => '<li>' + w + '</li>').join('')}</ul></div>`;
      }
      if (call.score.next_call_recommendation) {
        html += `<div class="detail-section"><h3>Next call strategy</h3><p>${call.score.next_call_recommendation}</p></div>`;
      }
    } else {
      html += `<p class="empty-note">Status: ${call.transcript_status}</p>`;
    }

    body.innerHTML = html;
  } catch (err) {
    body.innerHTML = '<p class="empty-note">Error: ' + err.message + '</p>';
  }
}

async function syncCalls() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  btn.textContent = 'Syncing…';
  try {
    const json = await api('/api/calls/sync', { method: 'POST' });
    alert('Synced. ' + json.newCalls + ' new, ' + json.processed + ' analyzed.' + (json.remaining ? ' ' + json.remaining + ' more pending.' : ''));
    loadAll();
  } catch (err) {
    alert('Sync failed: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sync calls';
  }
}

function populateBankCallSelect() {
  const select = document.getElementById('bankCallSelect');
  select.innerHTML = '<option value="">-- Select a call --</option>';
  for (const c of currentData.calls) {
    const label = (c.contact_name || c.phone_number || 'Unknown') + ' (' + (c.overall_score || '—') + '/100)';
    select.innerHTML += '<option value="' + c.id + '">' + label + '</option>';
  }
  if (selectedCallForBank) select.value = selectedCallForBank;
}

async function saveToBank() {
  const callId = document.getElementById('bankCallSelect').value;
  if (!callId) return alert('Select a call');

  try {
    await api('/api/call-bank/' + callId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bank_reason: document.getElementById('bankReason').value,
        text_option_1: document.getElementById('bankText1').value,
        text_option_2: document.getElementById('bankText2').value,
        text_option_3: document.getElementById('bankText3').value,
      }),
    });
    alert('Added to Call Bank!');
    document.getElementById('bankCallSelect').value = '';
    document.getElementById('bankReason').value = '';
    document.getElementById('bankText1').value = '';
    document.getElementById('bankText2').value = '';
    document.getElementById('bankText3').value = '';
    refreshBankList();
    loadAll();
  } catch (err) {
    alert('Failed to add to bank: ' + err.message);
  }
}

async function refreshBankList() {
  try {
    const banked = await api('/api/call-bank');
    currentData.bankedCalls = banked;
    if (banked.length) {
      document.getElementById('bankedCalls').style.display = 'block';
      let html = '';
      for (const c of banked) {
        html += `<div class="banked-call">
          <div class="banked-call-name">${c.contact_name || c.contact_phone || 'Unknown'} ${c.overall_score ? '· ' + c.overall_score + '/100' : ''}</div>
          ${c.bank_reason ? '<div class="banked-call-reason">' + c.bank_reason + '</div>' : ''}
        </div>`;
      }
      document.getElementById('bankList').innerHTML = html;
    } else {
      document.getElementById('bankedCalls').style.display = 'none';
    }
  } catch (err) {
    console.error('Failed to load bank list:', err);
  }
}
</script>
</body>
</html>
