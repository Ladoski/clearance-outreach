<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clearance Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181B;
    --panel: #1F2124;
    --hairline: #33302A;
    --brass: #AD8A55;
    --brass-dim: #7C6640;
    --ivory: #EDE7DC;
    --muted: #8C8478;
    --sage: #7C9473;
    --rust: #9B5A46;
    --amber: #C9A227;
  }

  * { box-sizing: border-box; }
  ::selection { background: var(--brass-dim); color: var(--ivory); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ivory);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  a { color: var(--brass); }

  .page { max-width: 1400px; margin: 0 auto; padding: 32px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    margin-bottom: 36px;
  }

  .wordmark { display: flex; align-items: baseline; gap: 14px; }
  .mark { width: 30px; height: 30px; flex-shrink: 0; color: var(--brass); }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.2px;
    margin: 0;
    color: var(--ivory);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }

  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  input[type=text], input[type=file], select {
    background: var(--panel);
    border: 1px solid var(--hairline);
    color: var(--ivory);
    padding: 10px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus, input[type=file]:focus, select:focus { border-color: var(--brass); }
  input[type=text]::placeholder { color: var(--muted); }

  button {
    background: transparent;
    color: var(--brass);
    border: 1px solid var(--brass-dim);
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  button:hover { background: var(--brass); color: #17181B; border-color: var(--brass); }
  button:disabled { opacity: 0.5; cursor: default; }

  .tabs {
    display: flex;
    gap: 24px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 32px;
  }
  .tab {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    padding: 0 0 14px;
    cursor: pointer;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab:hover { background: none; color: var(--ivory); }
  .tab.active { color: var(--brass); border-bottom-color: var(--brass); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .empty-note { color: var(--muted); font-style: italic; font-size: 13px; }

  /* Campaign cards */
  .campaign-card {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .campaign-card:hover { background: rgba(173,138,85,0.08); border-color: var(--brass-dim); }

  .campaign-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .campaign-name { font-family: 'Fraunces', serif; font-weight: 500; font-size: 15px; color: var(--ivory); }
  .campaign-region { font-size: 11px; color: var(--brass); font-weight: 600; letter-spacing: 0.3px; margin-top: 2px; }
  .campaign-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .campaign-actions { display: flex; gap: 6px; margin-top: 10px; }
  .campaign-actions button { flex: 1; padding: 6px 10px; font-size: 11px; }

  /* Campaign form */
  .campaign-form {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 10px;
  }
  .form-group button { width: 100%; }

  .progress-bar {
    height: 6px;
    background: var(--hairline);
    border-radius: 3px;
    margin: 8px 0;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--brass);
    transition: width 0.3s;
  }

  @media (max-width: 640px) {
    .page { padding: 16px; }
    header { flex-direction: column; align-items: flex-start; }
    .controls { width: 100%; flex-wrap: wrap; }
    input[type=text], input[type=file], select { width: 100%; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="wordmark">
      <svg class="mark" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 26V10L15 3L26 10V26" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M11 26V16H19V26" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Clearance Outreach</h1>
        <div class="subtitle">call coaching + campaigns</div>
      </div>
    </div>
    <div class="controls">
      <input type="text" id="apiKey" placeholder="Admin key" />
      <button onclick="loadAll()">Load</button>
      <button onclick="syncCalls()" id="syncBtn">Sync calls</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="calls" onclick="showTab('calls')">Calls & Coaching</button>
    <button class="tab" data-tab="campaigns" onclick="showTab('campaigns')">Campaigns</button>
  </div>

  <div class="tab-panel active" id="tab-calls">
    <div id="callsContent"><p class="empty-note">Enter admin key and click Load.</p></div>
  </div>

  <div class="tab-panel" id="tab-campaigns">
    <div id="campaignsContent"><p class="empty-note">Enter admin key and click Load.</p></div>
  </div>
</div>

<script>
let currentTab = 'calls';

function showTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  if (name === 'campaigns') loadCampaigns();
}

async function api(path, opts) {
  const key = document.getElementById('apiKey').value;
  const res = await fetch(path, { ...opts, headers: { ...(opts && opts.headers), 'x-api-key': key } });
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

async function loadAll() {
  try {
    const calls = await api('/api/calls');
    renderCalls(calls);
  } catch (err) {
    document.getElementById('callsContent').innerHTML = '<p class="empty-note">Error: ' + err.message + '</p>';
  }
}

function renderCalls(calls) {
  let html = '<p class="empty-note">Calls coming soon...</p>';
  if (calls && calls.length) {
    html = '<p>' + calls.length + ' calls in system</p>';
  }
  document.getElementById('callsContent').innerHTML = html;
}

async function syncCalls() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  btn.textContent = 'Syncing…';
  try {
    const json = await api('/api/calls/sync', { method: 'POST' });
    alert('Synced. ' + json.newCalls + ' new, ' + json.processed + ' analyzed.' + (json.remaining ? ' ' + json.remaining + ' more pending.' : ''));
    loadAll();
  } catch (err) {
    alert('Sync failed: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sync calls';
  }
}

async function loadCampaigns() {
  try {
    const campaigns = await api('/api/campaigns');
    const sequences = await api('/api/message-sequences/sequences');
    renderCampaigns(campaigns, sequences);
  } catch (err) {
    document.getElementById('campaignsContent').innerHTML = '<p class="empty-note">Error: ' + err.message + '</p>';
  }
}

function renderCampaigns(campaigns, sequences) {
  let html = `
    <div class="campaign-form">
      <h3 style="margin-top: 0; font-family: Fraunces; font-size: 16px; color: var(--ivory);">Create New Campaign</h3>
      <div class="form-group">
        <label>Campaign Name</label>
        <input type="text" id="campaignName" placeholder="e.g., 30x50 CDN Q4">
      </div>
      <div class="form-group">
        <label>Region</label>
        <select id="campaignRegion">
          <option value="">-- Select --</option>
          <option value="USA">USA</option>
          <option value="Canada">Canada</option>
        </select>
      </div>
      <div class="form-group">
        <label>Message Sequence</label>
        <select id="campaignSequence">
          <option value="">-- Select --</option>
          ${sequences.map(s => '<option value="' + s.id + '">' + s.name + '</option>').join('')}
        </select>
      </div>
      <button onclick="createCampaign()">Create Campaign</button>
    </div>

    <h3 style="font-family: Fraunces; font-size: 16px; color: var(--ivory); margin: 28px 0 16px;">Active Campaigns</h3>
  `;

  if (!campaigns.length) {
    html += '<p class="empty-note">No campaigns yet. Create one above.</p>';
  } else {
    for (const c of campaigns) {
      const percent = c.total_leads > 0 ? Math.round((c.completed_leads / c.total_leads) * 100) : 0;
      html += `
        <div class="campaign-card">
          <div class="campaign-top">
            <div>
              <div class="campaign-name">${c.name}</div>
              <div class="campaign-region">${c.region}</div>
              <div class="campaign-meta">${c.sequence_name} • ${c.total_leads} leads • ${c.status}</div>
            </div>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div>
          <div style="font-size: 11px; color: var(--muted); margin-bottom: 10px;">${c.completed_leads} of ${c.total_leads} completed (${percent}%)</div>
          <div class="campaign-actions">
            <button onclick="uploadCSV(${c.id})">📤 Upload CSV</button>
            <button onclick="startCampaign(${c.id})">▶ Start</button>
            <button onclick="viewCampaign(${c.id})">👁 View</button>
          </div>
        </div>
      `;
    }
  }

  document.getElementById('campaignsContent').innerHTML = html;
}

async function createCampaign() {
  const name = document.getElementById('campaignName').value;
  const region = document.getElementById('campaignRegion').value;
  const sequenceId = document.getElementById('campaignSequence').value;

  if (!name || !region || !sequenceId) return alert('Fill all fields');

  try {
    await api('/api/campaigns', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, region, sequenceId }),
    });
    alert('Campaign created!');
    loadCampaigns();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function uploadCSV(campaignId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    const formData = new FormData();
    formData.append('file', file);

    try {
      const key = document.getElementById('apiKey').value;
      const res = await fetch('/api/campaigns/' + campaignId + '/upload-leads', {
        method: 'POST',
        headers: { 'x-api-key': key },
        body: formData,
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Upload failed');
      alert('Uploaded! ' + json.enrolled + ' leads enrolled.');
      loadCampaigns();
    } catch (err) {
      alert('Upload failed: ' + err.message);
    }
  };
  input.click();
}

async function startCampaign(campaignId) {
  if (!confirm('Start sending messages to all leads in this campaign?')) return;

  try {
    const json = await api('/api/campaigns/' + campaignId + '/start-all', { method: 'POST' });
    alert('Started! ' + json.started + ' leads activated.');
    loadCampaigns();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function viewCampaign(campaignId) {
  try {
    const data = await api('/api/campaigns/' + campaignId + '/progress');
    alert(`Campaign: ${data.campaign.name}
Total Leads: ${data.stats.totalLeads}
Enrolled: ${data.stats.enrolledInSequence}
Completed: ${data.stats.completedSequence}`);
  } catch (err) {
    alert('Error: ' + err.message);
  }
}
</script>
</body>
</html>
