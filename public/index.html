<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clearance Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181B;
    --panel: #1F2124;
    --hairline: #33302A;
    --brass: #AD8A55;
    --brass-dim: #7C6640;
    --ivory: #EDE7DC;
    --muted: #8C8478;
    --sage: #7C9473;
    --rust: #9B5A46;
    --amber: #C9A227;
  }

  * { box-sizing: border-box; }
  ::selection { background: var(--brass-dim); color: var(--ivory); }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ivory);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  a { color: var(--brass); }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 32px 96px;
  }

  /* --- Header --- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    padding-bottom: 32px;
  }

  .wordmark { display: flex; align-items: baseline; gap: 14px; }
  .mark { width: 30px; height: 30px; flex-shrink: 0; color: var(--brass); }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.2px;
    margin: 0;
    color: var(--ivory);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }

  .key-form { display: flex; align-items: center; gap: 10px; }

  .key-form input[type=text] {
    background: var(--panel);
    border: 1px solid var(--hairline);
    color: var(--ivory);
    padding: 10px 14px;
    width: 220px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
  }
  .key-form input[type=text]:focus { border-color: var(--brass); }
  .key-form input[type=text]::placeholder { color: var(--muted); }

  button {
    background: transparent;
    color: var(--brass);
    border: 1px solid var(--brass-dim);
    padding: 10px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  button:hover { background: var(--brass); color: #17181B; border-color: var(--brass); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:disabled:hover { background: transparent; color: var(--brass); }
  button:focus-visible, a:focus-visible, .tab:focus-visible, .call-row:focus-visible {
    outline: 1.5px solid var(--brass); outline-offset: 2px;
  }

  /* --- Stat rail (the "hero") --- */
  .stat-rail {
    display: flex;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 36px;
  }
  .stat {
    flex: 1;
    padding: 20px 24px;
    border-right: 1px solid var(--hairline);
  }
  .stat:last-child { border-right: none; }
  .stat-num {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 34px;
    font-variant-numeric: tabular-nums;
    color: var(--ivory);
    line-height: 1;
  }
  .stat-num.flag-rust { color: var(--rust); }
  .stat-num.flag-sage { color: var(--sage); }
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    gap: 32px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 32px;
  }
  .tab {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    padding: 0 0 14px;
    cursor: pointer;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab:hover { background: none; color: var(--ivory); }
  .tab.active { color: var(--brass); border-bottom-color: var(--brass); }
  .tab .tab-count { color: inherit; opacity: 0.7; margin-left: 5px; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .section-label { display: flex; align-items: center; gap: 16px; margin: 40px 0 18px; }
  .section-label:first-child { margin-top: 0; }
  .section-label h2 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 17px;
    margin: 0; white-space: nowrap; color: var(--ivory);
  }
  .section-label .rule { flex: 1; height: 1px; background: var(--hairline); }

  .empty-note {
    color: var(--muted); font-size: 14px; font-style: italic;
    font-family: 'Fraunces', serif; padding: 8px 0 24px;
  }

  /* --- Follow-up buckets --- */
  .fu-buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0; border: 1px solid var(--hairline); }
  .fu-bucket { padding: 18px 20px; border-right: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
  .fu-bucket:last-child { border-right: none; }
  .fu-bucket h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 14px; margin: 0 0 2px; color: var(--brass); }
  .fu-bucket .fu-count { font-family: 'Fraunces', serif; font-size: 28px; color: var(--ivory); margin-bottom: 12px; }
  .fu-item { padding: 9px 0; border-top: 1px solid var(--hairline); font-size: 13px; }
  .fu-item:first-of-type { border-top: none; }
  .fu-item .fu-name { color: var(--ivory); }
  .fu-item .fu-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .fu-actions { display: flex; gap: 6px; margin-top: 6px; }
  .fu-actions button { padding: 4px 10px; font-size: 11px; }

  /* --- Round grouping (leads) --- */
  .round-group { margin-bottom: 36px; }
  .round-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--hairline); }
  .round-number { font-family: 'Fraunces', serif; font-size: 15px; color: var(--brass); }
  .round-meta { font-size: 12.5px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--hairline); }
  thead th.num { text-align: right; }
  tbody td { padding: 12px; border-bottom: 1px solid rgba(51,48,42,0.55); font-size: 13.5px; color: var(--ivory); vertical-align: middle; }
  tbody tr:hover td { background: rgba(173,138,85,0.05); }
  tbody tr:last-child td { border-bottom: none; }

  .price-cell { text-align: right; font-family: 'Fraunces', serif; font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--brass); white-space: nowrap; }
  .muted-cell { color: var(--muted); font-size: 12.5px; }

  .status { display: inline-block; padding: 3px 10px; border-radius: 30px; font-size: 11px; font-weight: 500; border: 1px solid currentColor; letter-spacing: 0.2px; }
  .status-new { color: var(--muted); }
  .status-contacted, .status-follow_up { color: var(--brass); }
  .status-replied, .status-negotiating { color: var(--amber); }
  .status-agreed, .status-offer_submitted, .status-approved, .status-won { color: var(--sage); }
  .status-floor_reached, .status-cold, .status-dead, .status-rejected, .status-lost { color: var(--rust); }

  /* --- Offers --- */
  .offer-row { display: flex; align-items: center; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--hairline); }
  .offer-row:last-child { border-bottom: none; }
  .offer-info { flex: 1; min-width: 0; }
  .offer-lead { font-family: 'Fraunces', serif; font-size: 16px; color: var(--ivory); }
  .offer-contact { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .offer-notes { font-size: 12.5px; color: var(--muted); margin-top: 6px; font-style: italic; }
  .offer-price { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; color: var(--brass); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .offer-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-approve { color: var(--sage); border-color: var(--sage); }
  .btn-approve:hover { background: var(--sage); color: #17181B; }
  .btn-reject { color: var(--rust); border-color: var(--rust); }
  .btn-reject:hover { background: var(--rust); color: #17181B; }

  /* --- Calls list --- */
  .call-row { padding: 16px 4px; border-bottom: 1px solid var(--hairline); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .call-row:hover { background: rgba(173,138,85,0.05); }
  .call-row:last-child { border-bottom: none; }
  .call-info .fu-name { font-size: 14.5px; }
  .call-priority { font-size: 12.5px; color: var(--muted); margin-top: 4px; font-style: italic; max-width: 520px; }

  .score-badge { display: inline-block; font-family: 'Fraunces', serif; font-weight: 500; font-size: 16px; padding: 3px 12px; border-radius: 30px; border: 1px solid currentColor; flex-shrink: 0; }
  .score-high { color: var(--sage); }
  .score-mid { color: var(--amber); }
  .score-low { color: var(--rust); }
  .score-none { color: var(--muted); font-size: 11.5px; font-style: italic; border-color: var(--hairline); }

  /* --- Slide-over panel --- */
  .scrim { position: fixed; inset: 0; background: rgba(10,10,10,0.55); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 40; }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
    background: var(--panel); border-left: 1px solid var(--hairline);
    transform: translateX(100%); transition: transform 0.25s ease;
    z-index: 41; overflow-y: auto; padding: 32px 36px 60px;
  }
  .panel.open { transform: translateX(0); }

  .panel-close { position: absolute; top: 28px; right: 28px; padding: 6px 10px; font-size: 16px; line-height: 1; }
  .panel-name { font-family: 'Fraunces', serif; font-size: 22px; margin: 0 0 4px; padding-right: 50px; }
  .panel-meta { font-size: 12.5px; color: var(--muted); margin-bottom: 28px; }

  .score-hero { display: flex; align-items: baseline; gap: 10px; margin-bottom: 28px; }
  .score-hero .num { font-family: 'Fraunces', serif; font-weight: 500; font-size: 56px; line-height: 1; }
  .score-hero .of100 { color: var(--muted); font-size: 15px; }

  .cat-row { margin-bottom: 12px; }
  .cat-row-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
  .cat-row-top .cat-label { color: var(--muted); }
  .cat-row-top .cat-val { color: var(--ivory); font-variant-numeric: tabular-nums; }
  .cat-bar-track { height: 4px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
  .cat-bar-fill { height: 100%; background: var(--brass); }

  .panel h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 14px; color: var(--brass); margin: 28px 0 10px; }
  .panel ul { margin: 0; padding-left: 18px; }
  .panel li { font-size: 13.5px; margin-bottom: 6px; color: var(--ivory); }
  .panel .recommendation { font-size: 13.5px; color: var(--ivory); background: rgba(173,138,85,0.08); border-left: 2px solid var(--brass); padding: 12px 14px; }
  .transcript { font-family: 'Fraunces', serif; font-style: italic; font-size: 13.5px; color: var(--muted); white-space: pre-wrap; line-height: 1.7; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--hairline); padding-top: 14px; }

  @media (max-width: 900px) {
    .stat-rail { flex-wrap: wrap; }
    .stat { flex: 1 1 50%; border-bottom: 1px solid var(--hairline); }
  }

  @media (max-width: 640px) {
    .page { padding: 32px 18px 64px; }
    header { flex-direction: column; align-items: flex-start; }
    .key-form input[type=text] { width: 100%; }
    .key-form { width: 100%; flex-wrap: wrap; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tbody tr { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
    tbody td { border: none; padding: 3px 0; }
    .price-cell { text-align: left; font-size: 18px; }
    .offer-row { flex-direction: column; align-items: flex-start; }
    .offer-actions { width: 100%; }
    .offer-actions button { flex: 1; }
    .tabs { gap: 20px; overflow-x: auto; }
    .panel { padding: 24px 20px 48px; width: 100vw; }
    .call-row { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="wordmark">
      <svg class="mark" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 26V10L15 3L26 10V26" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M11 26V16H19V26" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Clearance Outreach</h1>
        <div class="subtitle">the liquidation desk</div>
      </div>
    </div>
    <div class="key-form">
      <input type="text" id="apiKey" placeholder="Admin key" />
      <button onclick="loadAll()">Load</button>
      <button onclick="syncCalls()" id="syncBtn">Sync calls</button>
    </div>
  </header>

  <div class="stat-rail" id="statRail">
    <div class="stat"><div class="stat-num" id="statCallsToday">—</div><div class="stat-label">Calls today</div></div>
    <div class="stat"><div class="stat-num" id="statAvgScore">—</div><div class="stat-label">Avg score, last 25 calls</div></div>
    <div class="stat"><div class="stat-num flag-rust" id="statOverdue">—</div><div class="stat-label">Overdue follow-ups</div></div>
    <div class="stat"><div class="stat-num flag-sage" id="statHot">—</div><div class="stat-label">Hot leads</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="today" onclick="showTab('today')">Today <span class="tab-count" id="countToday"></span></button>
    <button class="tab" data-tab="calls" onclick="showTab('calls')">Calls &amp; coaching</button>
    <button class="tab" data-tab="leads" onclick="showTab('leads')">Leads by round</button>
    <button class="tab" data-tab="offers" onclick="showTab('offers')">Offers <span class="tab-count" id="countOffers"></span></button>
  </div>

  <div class="tab-panel active" id="tab-today">
    <div id="followups"><p class="empty-note">Enter your admin key and click Load.</p></div>
  </div>

  <div class="tab-panel" id="tab-calls">
    <div id="calls"><p class="empty-note">Enter your admin key and click Load.</p></div>
  </div>

  <div class="tab-panel" id="tab-leads">
    <div id="grouped"><p class="empty-note">Enter your admin key and click Load.</p></div>
  </div>

  <div class="tab-panel" id="tab-offers">
    <div id="offers"><p class="empty-note">Enter your admin key and click Load.</p></div>
  </div>

</div>

<div class="scrim" id="scrim" onclick="closePanel()"></div>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Call detail">
  <button class="panel-close" onclick="closePanel()" aria-label="Close">&times;</button>
  <div id="panelBody"><p class="empty-note">Loading…</p></div>
</div>

<script>
let currentTab = 'today';
let latestData = { followups: null, calls: [] };

function showTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach((p) => p.classList.toggle('active', p.id === 'tab-' + name));
}

async function api(path, opts) {
  const key = document.getElementById('apiKey').value;
  const res = await fetch(path, { ...opts, headers: { ...(opts && opts.headers), 'x-api-key': key } });
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

function money(n) {
  return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function fmtDate(d) {
  return d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
}

function isToday(d) {
  if (!d) return false;
  const a = new Date(d), b = new Date();
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

async function loadAll() {
  try {
    const buckets = await api('/api/followups');
    latestData.followups = buckets;
    renderFollowUps(buckets);
    updateFollowUpStats(buckets);
  } catch (err) {
    document.getElementById('followups').innerHTML = '<p class="empty-note">Could not load follow-ups: ' + err.message + '</p>';
  }
  try {
    const calls = await api('/api/calls');
    latestData.calls = calls;
    renderCalls(calls);
    updateCallStats(calls);
  } catch (err) {
    document.getElementById('calls').innerHTML = '<p class="empty-note">Could not load calls: ' + err.message + '</p>';
  }
  try {
    const grouped = await api('/api/leads/grouped');
    renderGrouped(grouped);
  } catch (err) {
    document.getElementById('grouped').innerHTML = '<p class="empty-note">Could not load leads: ' + err.message + '</p>';
  }
  try {
    const offers = await api('/api/offers?status=pending_approval');
    renderOffers(offers);
    document.getElementById('countOffers').textContent = offers.length ? offers.length : '';
  } catch (err) {
    document.getElementById('offers').innerHTML = '<p class="empty-note">Could not load offers: ' + err.message + '</p>';
  }
}

function updateCallStats(calls) {
  const todayCalls = calls.filter((c) => isToday(c.start_time));
  document.getElementById('statCallsToday').textContent = todayCalls.length;
  const scored = calls.filter((c) => c.overall_score != null).slice(0, 25);
  const avg = scored.length ? Math.round(scored.reduce((s, c) => s + c.overall_score, 0) / scored.length) : null;
  document.getElementById('statAvgScore').textContent = avg != null ? avg : '—';
}

function updateFollowUpStats(buckets) {
  const overdue = (buckets.overdue || []).length;
  const hot = (buckets.hot_leads || []).length;
  document.getElementById('statOverdue').textContent = overdue;
  document.getElementById('statHot').textContent = hot;
  const total = ['overdue', 'today', 'tomorrow', 'waiting_for_response'].reduce((s, k) => s + (buckets[k] || []).length, 0);
  document.getElementById('countToday').textContent = total ? total : '';
}

const BUCKET_LABELS = {
  overdue: 'Overdue',
  today: 'Due today',
  tomorrow: 'Due tomorrow',
  waiting_for_response: 'Waiting for response',
  hot_leads: 'Hot leads',
};

function renderFollowUps(buckets) {
  const el = document.getElementById('followups');
  const keys = Object.keys(BUCKET_LABELS);
  const anyItems = keys.some((k) => (buckets[k] || []).length);
  if (!anyItems) {
    el.innerHTML = '<p class="empty-note">Nothing needs follow-up right now. Sync calls to pull in new contacts.</p>';
    return;
  }
  let html = '<div class="fu-buckets">';
  for (const key of keys) {
    const items = buckets[key] || [];
    html += '<div class="fu-bucket"><h3>' + BUCKET_LABELS[key] + '</h3><div class="fu-count">' + items.length + '</div>';
    if (!items.length) html += '<p class="empty-note" style="padding:0">Nothing here.</p>';
    for (const c of items.slice(0, 8)) {
      html += '<div class="fu-item">' +
        '<div class="fu-name">' + (c.name || c.phone || 'Unknown') + (c.last_call_score != null ? ' · ' + c.last_call_score + '/100' : '') + '</div>' +
        '<div class="fu-meta">' + (c.phone || '') + (c.company ? ' · ' + c.company : '') + '</div>' +
        '<div class="fu-actions">' +
        '<button onclick="snooze(' + c.id + ', 24)">+1 day</button>' +
        '<button onclick="completeFollowUp(' + c.id + ')">Done</button>' +
        '</div></div>';
    }
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

async function snooze(contactId, hours) {
  await api('/api/followups/' + contactId + '/snooze', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hours }),
  });
  loadAll();
}

async function completeFollowUp(contactId) {
  await api('/api/followups/' + contactId + '/complete', { method: 'POST' });
  loadAll();
}

function scoreClass(score) {
  if (score == null) return 'score-none';
  if (score >= 80) return 'score-high';
  if (score >= 60) return 'score-mid';
  return 'score-low';
}

function renderCalls(calls) {
  const el = document.getElementById('calls');
  if (!calls.length) {
    el.innerHTML = '<p class="empty-note">No calls synced yet. Click "Sync calls" above.</p>';
    return;
  }
  let html = '';
  for (const c of calls.slice(0, 40)) {
    const scoreHtml = c.overall_score != null
      ? '<span class="score-badge ' + scoreClass(c.overall_score) + '">' + c.overall_score + '/100</span>'
      : '<span class="score-badge score-none">' + (c.transcript_status === 'processing' ? 'analyzing…' : c.transcript_status === 'no_recording' ? 'no recording' : c.transcript_status) + '</span>';
    html += '<div class="call-row" tabindex="0" onclick="viewCall(' + c.id + ')" onkeydown="if(event.key===\'Enter\')viewCall(' + c.id + ')">' +
      '<div class="call-info">' +
      '<div class="fu-name">' + (c.contact_name || c.contact_phone || c.phone_number || 'Unknown') + '</div>' +
      '<div class="fu-meta">' + (c.direction || '') + ' · ' + fmtDate(c.start_time) + (c.duration_seconds ? ' · ' + Math.round(c.duration_seconds / 60) + ' min' : '') + '</div>' +
      (c.coaching_priority ? '<div class="call-priority">' + c.coaching_priority + '</div>' : '') +
      '</div>' + scoreHtml + '</div>';
  }
  el.innerHTML = html;
}

const CATEGORY_LABELS = {
  opening: ['Opening', 10],
  discovery: ['Discovery', 20],
  qualification: ['Qualification', 10],
  objection_handling: ['Objection handling', 15],
  closing: ['Closing', 15],
  communication: ['Communication', 10],
};

async function viewCall(id) {
  openPanel();
  const body = document.getElementById('panelBody');
  body.innerHTML = '<p class="empty-note">Loading…</p>';
  try {
    const call = await api('/api/calls/' + id);
    let html = '<div class="panel-name">' + (call.contact_name || call.contact_phone || 'Unknown caller') + '</div>' +
      '<div class="panel-meta">' + (call.direction || '') + ' · ' + fmtDate(call.start_time) + (call.duration_seconds ? ' · ' + Math.round(call.duration_seconds / 60) + ' min' : '') + '</div>';

    if (call.score) {
      const s = call.score;
      html += '<div class="score-hero"><span class="num ' + scoreClass(s.overall_score).replace('score-', 'score-') + '" style="color:' + scoreColor(s.overall_score) + '">' + s.overall_score + '</span><span class="of100">/ 100</span></div>';
      for (const key of Object.keys(CATEGORY_LABELS)) {
        const [label, max] = CATEGORY_LABELS[key];
        const val = (s.categories && s.categories[key]) || 0;
        const pct = Math.round((val / max) * 100);
        html += '<div class="cat-row"><div class="cat-row-top"><span class="cat-label">' + label + '</span><span class="cat-val">' + val + ' / ' + max + '</span></div>' +
          '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + pct + '%"></div></div></div>';
      }
      if (s.strengths && s.strengths.length) html += '<h3>What went well</h3><ul>' + s.strengths.map((x) => '<li>' + x + '</li>').join('') + '</ul>';
      if (s.weaknesses && s.weaknesses.length) html += '<h3>What hurt it</h3><ul>' + s.weaknesses.map((x) => '<li>' + x + '</li>').join('') + '</ul>';
      if (s.missed_opportunities && s.missed_opportunities.length) html += '<h3>Missed opportunities</h3><ul>' + s.missed_opportunities.map((x) => '<li>' + x + '</li>').join('') + '</ul>';
      if (s.next_call_recommendation) html += '<h3>Next call</h3><div class="recommendation">' + s.next_call_recommendation + '</div>';
    } else {
      html += '<p class="empty-note">Status: ' + call.transcript_status + '. ' + (call.transcript_status === 'processing' ? 'Still transcribing/scoring — check back shortly.' : call.transcript_status === 'no_recording' ? 'No recording was available for this call.' : '') + '</p>';
      if (call.transcript_status === 'failed' && call.last_error) {
        html += '<div class="recommendation">' + call.last_error.replace(/</g, '&lt;') + '</div>';
      }
    }

    if (call.transcript) {
      html += '<h3>Transcript</h3><div class="transcript">' + call.transcript.replace(/</g, '&lt;') + '</div>';
    }

    body.innerHTML = html;
  } catch (err) {
    body.innerHTML = '<p class="empty-note">Could not load call: ' + err.message + '</p>';
  }
}

function scoreColor(score) {
  if (score == null) return 'var(--muted)';
  if (score >= 80) return 'var(--sage)';
  if (score >= 60) return 'var(--amber)';
  return 'var(--rust)';
}

function openPanel() {
  document.getElementById('scrim').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
function closePanel() {
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

async function syncCalls() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  btn.textContent = 'Syncing…';
  try {
    const json = await api('/api/calls/sync', { method: 'POST' });
    let msg = 'Synced. ' + json.newCalls + ' new call(s), ' + json.processed + ' analyzed.';
    if (json.remaining > 0) {
      msg += ' ' + json.remaining + ' more still need processing — click Sync calls again to continue (or wait for the hourly auto-sync).';
    }
    alert(msg);
    loadAll();
  } catch (err) {
    alert('Sync failed: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sync calls';
  }
}

function renderGrouped(groups) {
  const el = document.getElementById('grouped');
  if (!groups.length) {
    el.innerHTML = '<p class="empty-note">No leads yet. Import a list to get started.</p>';
    return;
  }
  let html = '';
  for (const g of groups) {
    html += '<div class="round-group"><div class="round-header">' +
      '<span class="round-number">Round ' + g.day_count + '</span>' +
      '<span class="round-meta"><span class="status status-' + g.status + '">' + g.status.replace('_', ' ') + '</span> &nbsp;·&nbsp; ' + g.lead_count + ' lead' + (g.lead_count === 1 ? '' : 's') + '</span>' +
      '</div><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th class="num">Current price</th><th>Last contacted</th><th>Next follow-up</th></tr></thead><tbody>';
    for (const l of g.leads) {
      html += '<tr><td>' + (l.name || '—') + '</td><td class="muted-cell">' + (l.phone || '—') + '</td><td class="muted-cell">' + (l.email || '—') + '</td>' +
        '<td class="price-cell">' + (l.current_price != null ? money(l.current_price) : '—') + '</td>' +
        '<td class="muted-cell">' + fmtDate(l.last_contacted_at) + '</td><td class="muted-cell">' + fmtDate(l.next_follow_up_at) + '</td></tr>';
    }
    html += '</tbody></table></div>';
  }
  el.innerHTML = html;
}

function renderOffers(offers) {
  const el = document.getElementById('offers');
  if (!offers.length) {
    el.innerHTML = '<p class="empty-note">Nothing to review yet.</p>';
    return;
  }
  let html = '';
  for (const o of offers) {
    html += '<div class="offer-row"><div class="offer-info">' +
      '<div class="offer-lead">' + (o.lead_name || 'Unnamed lead') + '</div>' +
      '<div class="offer-contact">' + (o.phone || o.email || '') + (o.submitted_by ? ' · submitted by ' + o.submitted_by : '') + '</div>' +
      (o.notes ? '<div class="offer-notes">' + o.notes + '</div>' : '') + '</div>' +
      '<div class="offer-price">' + money(o.proposed_price) + '</div>' +
      '<div class="offer-actions">' +
      '<button class="btn-approve" onclick="reviewOffer(' + o.id + ', \'approved\')">Approve</button>' +
      '<button class="btn-reject" onclick="reviewOffer(' + o.id + ', \'rejected\')">Reject</button>' +
      '</div></div>';
  }
  el.innerHTML = html;
}

async function reviewOffer(id, status) {
  try {
    await api('/api/offers/' + id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, reviewed_by: 'boss' }),
    });
    loadAll();
  } catch (err) {
    alert('Failed to update offer: ' + err.message);
  }
}
</script>
